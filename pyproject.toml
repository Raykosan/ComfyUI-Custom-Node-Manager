[project]
name = "ComfyUI-Custom-Node-Manager"
version = "0.2.3"
description = "Alternative manager for custom_nodes that bypasses ComfyUI Manager restrictions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Raykosan/ComfyUI-Custom-Node-Manager"
Issues = "https://github.com/Raykosan/ComfyUI-Custom-Node-Manager/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
